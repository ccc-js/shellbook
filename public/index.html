<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>shellbook v0.3</title>
<link rel="stylesheet" href="/vendor/xterm-css/xterm.css" />
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden;
         font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; }
  #menu { flex: 0 0 36px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
          background: #1e1e1e; color: #ddd; font-size: 13px; white-space: nowrap; overflow: hidden; }
  #menu select { max-width: 200px; }
  #conn { width: 10px; height: 10px; border-radius: 50%; background: #888; display: inline-block; }
  #conn.ok { background: #3fb950; } #conn.bad { background: #f85149; }
  #menu .spacer { flex: 1; }
  #menu button { font-size: 12px; }
  #book { flex: 1 1 auto; overflow: auto; padding: 16px 24px; min-height: 120px; background: #fafafa;
          line-height: 1.6; }
  #book pre { background: #f0f0f0; padding: 10px 12px; border-radius: 6px; overflow: auto; }
  #splitter { flex: 0 0 6px; cursor: row-resize; background: #2a2a2a; }
  #splitter:hover, #splitter.dragging { background: #4a90e2; }
  #shell-pane { flex: 0 0 360px; display: flex; flex-direction: column; min-height: 90px; background: #000; }
  #shell-bar { flex: 0 0 26px; display: flex; align-items: center; gap: 8px; padding: 0 8px;
               background: #161616; color: #bbb; font-size: 12px; }
  #terminal { flex: 1; overflow: hidden; }
  .codeblock { border: 1px solid #ddd; border-radius: 6px; margin: 12px 0; overflow: hidden; }
  .codeblock pre { margin: 0; border-radius: 0; }
  .cb-bar { display: flex; align-items: center; gap: 8px; background: #e8eef5; padding: 4px 8px; font-size: 12px; }
  .cb-bar .mode { background: #4a90e2; color: #fff; border-radius: 3px; padding: 0 6px; }
  .cb-bar .hint { color: #666; }
  .cb-bar .spacer { flex: 1; }
  .cb-bar button { font-size: 12px; cursor: pointer; }
  .cb-note { font-size: 12px; color: #666; padding: 2px 8px 6px; background: #f7fafd; }
  .cb-progress { font-size: 12px; padding: 4px 8px; background: #f7fafd; color: #333; }
  .cb-progress.ok { background: #e6f4ea; color: #137333; }
  .cb-progress.fail { background: #fdecea; color: #a00; }
  .codeblock pre code { display: block; }
  .codeblock .cl { display: block; padding: 0 4px; border-left: 3px solid transparent; }
  .codeblock .st-ok { background: #e6f4ea; border-left-color: #34a853; }
  .codeblock .st-fail { background: #fdecea; border-left-color: #ea4335; }
  .codeblock.busy button[data-act="step"], .codeblock.busy button[data-act="run"] { opacity: .4; pointer-events: none; }
  #bookErr { color: #a00; }
</style>
</head>
<body>
  <header id="menu">
    <strong>shellbook</strong><span style="color:#888">v0.3</span>
    <label>書籍 <select id="bookSel"><option value="">載入中…</option></select></label>
    <label>章節 <select id="chSel"><option value="">—</option></select></label>
    <button id="btnReconnect">重連</button>
    <button id="btnInterrupt" title="送 Ctrl+C">中斷</button>
    <span class="spacer"></span>
    <span id="cwd">workspace/</span>
    <span id="conn" class="bad" title="連線狀態"></span>
  </header>

  <main id="book"><p>書籍載入中…</p></main>

  <div id="splitter" title="拖曳調整 book/shell 高度（雙擊回 20 rows）"></div>

  <footer id="shell-pane">
    <div id="shell-bar">
      <span>shell</span><span id="shellCwd">workspace/</span>
      <span class="spacer" style="flex:1"></span>
      <button id="btnClear">清空</button>
      <button id="btnInt2">Ctrl+C</button>
    </div>
    <div id="terminal"></div>
  </footer>

<script src="/vendor/marked/marked.umd.js"></script>
<script type="module">
import { Terminal } from '/vendor/xterm/xterm.mjs';
import { FitAddon } from '/vendor/fit/addon-fit.mjs';

// ---------- shell（沿用 v0.1） ----------
const term = new Terminal({ cursorBlink: true, fontSize: 14, scrollback: 5000 });
const fit = new FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('terminal'));

const conn = document.getElementById('conn');
let ws = null;

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws/shell`);
  ws.onopen = () => { conn.className = 'ok'; fit.fit();
    ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows })); };
  ws.onclose = () => { conn.className = 'bad'; };
  ws.onerror = () => { conn.className = 'bad'; };
  ws.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === 'output') term.write(msg.data);
    else onRunMsg(msg); // v0.3：單步/全跑進度
  };
}
connect();

term.onData((d) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'input', data: d })); });

const sendResize = () => { try { fit.fit(); } catch {}
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows })); };
new ResizeObserver(sendResize).observe(document.getElementById('terminal'));
window.addEventListener('resize', sendResize);

document.getElementById('btnReconnect').onclick = () => { try { ws.close(); } catch {} connect(); };
const interrupt = () => ws && ws.readyState === 1 && ws.send(JSON.stringify({ type: 'input', data: '\x03' }));
document.getElementById('btnInterrupt').onclick = interrupt;
document.getElementById('btnInt2').onclick = interrupt;
document.getElementById('btnClear').onclick = () => term.clear();

// ---------- book（v0.2 新增：載入 + 渲染 + 插入） ----------
const bookEl = document.getElementById('book');
const bookSel = document.getElementById('bookSel');
const chSel = document.getElementById('chSel');

// 與後端 src/books.js 同規則的前端判定（保持 id 一致：base-n）
function parseInfo(info) {
  const tokens = info.trim().split(/\s+/).filter(Boolean);
  const lang = (tokens.shift() || '').toLowerCase();
  let mode = null, cwd = null, expect = null;
  for (const t of tokens) {
    if (t === '#run') mode = mode || 'run';
    else if (t === '#step') mode = 'step';
    else if (t.startsWith('cwd:')) cwd = t.slice(4) || null;
    else if (t.startsWith('expect:')) expect = t.slice(7) || null;
  }
  return { lang, mode, cwd, expect };
}
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// 章節渲染：非 code 段走 marked，fence 自行處理以精準掛按鈕
function renderChapter(markdown, base) {
  const re = /```([^\n]*)\n([\s\S]*?)(?:```|$)/g;
  let last = 0, m, n = 0, html = '';
  while ((m = re.exec(markdown)) !== null) {
    html += marked.parse(markdown.slice(last, m.index));
    last = m.index + m[0].length;
    const { lang, mode, cwd, expect } = parseInfo(m[1] || '');
    const code = m[2].replace(/\s+$/, '');
    if (mode && code.trim()) {
      n += 1;
      const id = `${base}-${n}`;
      const hints = [cwd ? `cwd:${esc(cwd)}` : '', expect ? `觀察：${esc(expect)}` : ''].filter(Boolean).join(' · ');
      html += `<div class="codeblock" data-block-id="${id}" data-mode="${mode}">`
        + `<div class="cb-bar"><span class="mode">${mode === 'step' ? '單步' : '整塊'}</span>`
        + `<span>${esc(lang)} · ${code.split('\n').length} 行</span>`
        + `<span class="spacer"></span>`
        + `<button data-act="step">單步 ▶|</button><button data-act="run">全跑 ▶▶</button><button data-act="copy">複製</button></div>`
        + `<pre><code>${esc(code)}</code></pre>`
        + `<div class="cb-progress">尚未執行</div>`
        + (hints ? `<div class="cb-note">${hints}</div>` : '')
        + `</div>`;
    } else {
      html += `<pre><code>${esc(code)}</code></pre>`;
    }
  }
  html += marked.parse(markdown.slice(last));
  return html;
}

async function loadBooks() {
  const r = await fetch('/api/books');
  const list = await r.json();
  bookSel.innerHTML = list.length
    ? list.map((b) => `<option value="${b.name}">${b.title}</option>`).join('')
    : '<option value="">（尚無書籍）</option>';
  if (list.length) await loadBook(list[0].name);
  else bookEl.innerHTML = '<p>尚無書籍，請在 books/ 下放一本書（見 _doc/BOOK.md）。</p>';
}

async function loadBook(name) {
  bookSel.value = name;
  const r = await fetch(`/api/books/${encodeURIComponent(name)}`);
  if (!r.ok) { bookEl.innerHTML = `<p id="bookErr">載入書籍失敗：${r.status}</p>`; return; }
  const book = await r.json();
  chSel.innerHTML = book.chapters.map((c) => `<option value="${c.file}">${c.title}</option>`).join('');
  if (book.chapters.length) await loadChapter(name, book.chapters[0].file);
}

async function loadChapter(name, file) {
  chSel.value = file;
  const base = file.replace(/\.md$/, '');
  const r = await fetch(`/api/books/${encodeURIComponent(name)}/ch/${encodeURIComponent(base)}`);
  if (!r.ok) { bookEl.innerHTML = `<p id="bookErr">載入章節失敗：${r.status}</p>`; return; }
  const ch = await r.json();
  bookEl.innerHTML = renderChapter(ch.markdown, base);
  bookEl.scrollTop = 0;
}

bookSel.onchange = () => bookSel.value && loadBook(bookSel.value);
chSel.onchange = () => bookSel.value && chSel.value && loadChapter(bookSel.value, chSel.value);

// 單步 / 全跑（v0.3；事件委派＋busy 互斥，避免交錯送指令）
const blockLines = {}; // blockId -> 後端切好的 steps（runStarted/stepStarted 回來才有）
const blockStatus = {}; // blockId -> 每行 exit code（null=未跑）
const boxOf = (id) => bookEl.querySelector(`[data-block-id="${CSS.escape(id)}"]`);
const setBusy = (box, busy) => box && box.classList.toggle('busy', busy);
const progOf = (box) => box && box.querySelector('.cb-progress');

function paint(box) {
  const id = box.dataset.blockId;
  const lines = blockLines[id] || box.querySelector('code').textContent.split('\n');
  const st = blockStatus[id] || [];
  box.querySelector('code').innerHTML = lines.map((l, i) =>
    `<span class="cl${st[i] === undefined ? '' : st[i] === 0 ? ' st-ok' : ' st-fail'}" data-i="${i}">${esc(l) || ' '}</span>`
  ).join('\n');
}

function setProg(box, text, cls) {
  const p = progOf(box);
  if (!p) return;
  p.textContent = text;
  p.className = 'cb-progress' + (cls ? ` ${cls}` : '');
}

function needConn() {
  if (!ws || ws.readyState !== 1) { alert('shell 尚未連線，請先按「重連」'); return false; }
  return true;
}

bookEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const box = e.target.closest('.codeblock');
  const id = box.dataset.blockId;
  const code = box.querySelector('code').textContent;
  if (btn.dataset.act === 'copy') {
    try { await navigator.clipboard.writeText(code); btn.textContent = '已複製'; }
    catch { btn.textContent = '複製失敗'; }
    setTimeout(() => (btn.textContent = '複製'), 1200);
  } else if (!needConn() || box.classList.contains('busy')) {
    return;
  } else if (btn.dataset.act === 'step') {
    setBusy(box, true);
    ws.send(JSON.stringify({ type: 'step', blockId: id, code }));
    term.focus();
  } else if (btn.dataset.act === 'run') {
    setBusy(box, true);
    setProg(box, '全跑執行中…');
    ws.send(JSON.stringify({ type: 'run', blockId: id, code }));
    term.focus();
  }
});

// 後端 run/step 訊息 → 高亮＋進度
function onRunMsg(msg) {
  const box = msg.blockId ? boxOf(msg.blockId) : null;
  if (!box) return;
  const id = msg.blockId;
  if (msg.type === 'runStarted' || msg.type === 'stepStarted') {
    blockLines[id] = msg.lines;
    blockStatus[id] = new Array(msg.total).fill(undefined);
    paint(box);
    setProg(box, msg.type === 'runStarted' ? `全跑執行中 0/${msg.total}…` : `單步就緒 0/${msg.total}，按「單步」逐行執行`);
    if (msg.type === 'runStarted') setBusy(box, true);
  } else if (msg.type === 'result' || msg.type === 'stepResult') {
    if (!blockLines[id]) { blockLines[id] = [msg.line]; blockStatus[id] = [undefined]; }
    blockStatus[id][msg.index] = msg.exitCode === null ? -1 : msg.exitCode;
    paint(box);
    const mark = msg.timeout ? '超時' : `exit=${msg.exitCode}`;
    if (msg.type === 'result') {
      setProg(box, `全跑中 ${msg.index + 1}/${msg.total}（${mark}，${msg.durationMs}ms）`);
    } else {
      setBusy(box, false);
      const stepBtn = box.querySelector('button[data-act="step"]');
      if (msg.done) {
        if (stepBtn) stepBtn.textContent = '單步 ▶|';
        setProg(box, msg.error ? `單步：${msg.error}` : `單步完成 ${msg.total}/${msg.total}`, msg.error ? 'fail' : 'ok');
      } else {
        if (stepBtn) stepBtn.textContent = `下一步 (${msg.index + 2}/${msg.total})`;
        setProg(box, `單步 ${msg.index + 1}/${msg.total}（${mark}，${msg.durationMs}ms）`);
      }
      if (msg.error) setProg(box, `單步：${msg.error}`, 'fail');
    }
  } else if (msg.type === 'runDone') {
    setBusy(box, false);
    if (msg.ok) setProg(box, `✓ 全跑完成`, 'ok');
    else if (msg.error) setProg(box, `全跑：${msg.error}`, 'fail');
    else setProg(box, `✗ 第 ${msg.failedIndex + 1} 行失敗（exit=${msg.exitCode}），已停止`, 'fail');
  } else if (msg.type === 'stepReset') {
    setBusy(box, false);
  }
}

loadBooks().catch((e) => { bookEl.innerHTML = `<p id="bookErr">載入書籍失敗：${e.message}</p>`; });

// ---------- 中間分隔條拖曳（沿用 v0.1） ----------
const splitter = document.getElementById('splitter');
const shellPane = document.getElementById('shell-pane');
const DEFAULT_H = 360;
try {
  const saved = parseInt(localStorage.getItem('shellbook.shellHeight'), 10);
  if (saved >= 90) shellPane.style.flexBasis = saved + 'px';
} catch {}
requestAnimationFrame(sendResize);

splitter.addEventListener('mousedown', (e) => {
  e.preventDefault();
  const startY = e.clientY, startH = shellPane.offsetHeight;
  splitter.classList.add('dragging');
  const move = (ev) => {
    const maxH = window.innerHeight - 36 - 6 - 120;
    const h = Math.min(Math.max(startH + (startY - ev.clientY), 90), maxH);
    shellPane.style.flexBasis = h + 'px';
  };
  const up = () => {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    splitter.classList.remove('dragging');
    sendResize();
    try { localStorage.setItem('shellbook.shellHeight', shellPane.offsetHeight); } catch {}
  };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
});
splitter.addEventListener('dblclick', () => {
  shellPane.style.flexBasis = DEFAULT_H + 'px';
  sendResize();
  try { localStorage.setItem('shellbook.shellHeight', DEFAULT_H); } catch {}
});
</script>
</body>
</html>
